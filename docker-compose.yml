services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tripcraft
      MYSQL_USER: tripcraft
      MYSQL_PASSWORD: tripcraft_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports: ["3306:3306"]
    volumes: ["tripcraft_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utripcraft", "-ptripcraft_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/tripcraft?serverTimezone=UTC
      DB_USER: tripcraft
      DB_PASSWORD: tripcraft_dev
      JWT_SECRET: docker-development-secret-change-me-123456789
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  tripcraft_mysql:
