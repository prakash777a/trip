spring.application.name=tripcraft-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_app?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB
jwt.secret=${JWT_SECRET:}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:}
llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.serialization.write-dates-as-timestamps=false
app.upload-dir=${UPLOAD_DIR:uploads}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173}
